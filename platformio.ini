; Pager — PlatformIO configuration
; Targets:
;   [env:pager] M5Stack CoreS3 SE (ESP32-S3, 16 MB Flash, 8 MB PSRAM) — primary
;   [env:dial]  M5Stack Dial      (ESP32-S3,  8 MB Flash, no PSRAM, round) — smoke

[platformio]
default_envs = pager
description  = A physical Claude Code remote for your desk.

; ─── Shared bits ────────────────────────────────────────────────────────────
; Everything in [common] is consumed via ${common.<key>} in the env sections
; below. Keeps board-specific divergence visible.

[common]
platform        = espressif32@6.7.0
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
extra_scripts   = pre:scripts/fix_lvgl_xtensa.py

build_unflags =
    -std=gnu++11

base_build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include

lib_deps =
    ; Pinned to the pre-2026-04-21 pair. M5GFX 0.2.20 added an LVGLfont class
    ; that references LV_FONT_GLYPH_FORMAT_*_ALIGNED + req_raw_bitmap, which
    ; exist in no released LVGL 9.x. M5Unified 0.2.14 hard-references new
    ; board enums only present in M5GFX 0.2.20, so the pair has to move
    ; together. 0.2.13 / 0.2.19 are the last known-good combination.
    m5stack/M5Unified       @ 0.2.13
    m5stack/M5GFX           @ 0.2.19
    h2zero/NimBLE-Arduino   @ ^2.0.0
    bblanchon/ArduinoJson   @ ^7.0.4
    ; Pinned to 9.2.x as a defensive measure; lv_conf.h is written for 9.2.
    lvgl/lvgl               @ ~9.2.0

; ─── CoreS3 SE (primary) ───────────────────────────────────────────────────

[env:pager]
platform  = ${common.platform}
board     = esp32-s3-devkitc-1
framework = ${common.framework}

; CoreS3-specific: octal PSRAM, 16 MB flash. The libdeps include path is
; per-env (PlatformIO uses .pio/libdeps/<env>/), so M5GFX's compat shim can
; resolve <lvgl/lvgl.h> and defer to real LVGL.
build_flags =
    ${common.base_build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I .pio/libdeps/pager

build_unflags = ${common.build_unflags}

board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

; 1.5 Mbit/s sometimes hangs the USB-CDC baud-change on CoreS3 SE; 460800 is
; reliable. Bump back up if you want faster flashes and the change works.
upload_speed    = 460800
monitor_speed   = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts   = ${common.extra_scripts}

lib_deps = ${common.lib_deps}

; ─── M5Stack Dial (experimental smoke build) ──────────────────────────────
; First-pass config to see whether the back half of the firmware (BLE +
; protocol + state + persistence) ports to the M5Stack Dial. UI will paint
; wrong — the layout is sized for 320×240 landscape and the Dial is a round
; 240×240 panel — but pairing and heartbeats work end-to-end. Iterate from
; here. The Dial also exposes a rotary encoder (M5.Encoder) that this build
; does not yet wire; the encoder push surfaces as M5.BtnA so the modal still
; works via push-tap / push-hold.

[env:dial]
platform  = ${common.platform}
board     = esp32-s3-devkitc-1
framework = ${common.framework}

; No PSRAM on the Dial. session.cpp:30 already falls back to the internal
; heap if SPIRAM alloc fails, so the turn-event ring buffer still works —
; it just lives in SRAM and competes with LVGL for space.
; PAGER_BOARD_DIAL switches router.cpp to a single-button modal mapping
; (encoder push tap=approve, encoder push hold=deny) — the Dial has only
; one front-face button (the encoder press itself), so the existing CoreS3
; SE left-deny / right-approve bezel mapping has nothing to bind to.
build_flags =
    ${common.base_build_flags}
    -DPAGER_BOARD_DIAL
    -I .pio/libdeps/dial

build_unflags = ${common.build_unflags}

board_build.partitions  = default_8MB.csv
board_upload.flash_size = 8MB

; Dial USB-CDC is even less tolerant than the CoreS3 SE — neither 460800 nor
; staying at 115200 keeps the stub talking after handoff. --no-stub uses the
; ROM bootloader directly for the whole flash, which is slow (~2 min) but
; works reliably from the running firmware. Revisit if esptool / the on-chip
; USB stack handles the handoff better.
upload_speed    = 115200
upload_flags    = --no-stub
monitor_speed   = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts   = ${common.extra_scripts}

lib_deps = ${common.lib_deps}
