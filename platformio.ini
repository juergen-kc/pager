; Pager — PlatformIO configuration
; Target: M5Stack CoreS3 SE (ESP32-S3, 16 MB Flash, 8 MB PSRAM)

[platformio]
default_envs = pager
description  = A physical Claude Code remote for your desk.

[env:pager]
platform  = espressif32@6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

; CoreS3 build flags from M5Stack's official PlatformIO guidance, plus LVGL
; configuration: tell LVGL to find lv_conf.h in our include/ directory and
; bake in the small bits of glue config it needs at compile time.
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include

build_unflags =
    -std=gnu++11

board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

upload_speed    = 1500000
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    m5stack/M5Unified       @ ^0.2.0
    h2zero/NimBLE-Arduino   @ ^2.0.0
    bblanchon/ArduinoJson   @ ^7.0.4
    lvgl/lvgl               @ ^9.2.0
