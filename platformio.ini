; Pager — PlatformIO configuration
; Target: M5Stack CoreS3 SE (ESP32-S3, 16 MB Flash, 8 MB PSRAM)

[platformio]
default_envs = pager
description  = A physical Claude Code remote for your desk.

[env:pager]
platform  = espressif32@6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

; CoreS3 build flags from M5Stack's official PlatformIO guidance, plus LVGL
; configuration: tell LVGL to find lv_conf.h in our include/ directory and
; bake in the small bits of glue config it needs at compile time.
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
    ; Expose libdeps root so M5GFX's compat shim resolves <lvgl/lvgl.h> and
    ; defers to real LVGL instead of defining its own conflicting font types.
    -I .pio/libdeps/pager

build_unflags =
    -std=gnu++11

board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

; 1.5 Mbit/s sometimes hangs the USB-CDC baud-change on CoreS3 SE; 460800 is
; reliable. Bump back up if you want faster flashes and the change works.
upload_speed    = 460800
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

extra_scripts = pre:scripts/fix_lvgl_xtensa.py

lib_deps =
    ; Pinned to the pre-2026-04-21 pair. M5GFX 0.2.20 added an LVGLfont class
    ; that references LV_FONT_GLYPH_FORMAT_*_ALIGNED + req_raw_bitmap, which
    ; exist in no released LVGL 9.x. M5Unified 0.2.14 hard-references new
    ; board enums only present in M5GFX 0.2.20, so the pair has to move
    ; together. 0.2.13 / 0.2.19 are the last known-good combination.
    m5stack/M5Unified       @ 0.2.13
    m5stack/M5GFX           @ 0.2.19
    h2zero/NimBLE-Arduino   @ ^2.0.0
    bblanchon/ArduinoJson   @ ^7.0.4
    ; Pinned to 9.2.x as a defensive measure; lv_conf.h is written for 9.2.
    lvgl/lvgl               @ ~9.2.0
